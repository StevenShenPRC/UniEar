name: GitHub Release

on:
  push:
    tags: ['v*']
    branches: [feature/release-docs]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate the release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          gradle = Path('android/build.gradle.kts').read_text()
          version = re.search(r'^\s*versionName\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*$', gradle, re.M)
          if not version:
              raise SystemExit('Android versionName must be MAJOR.MINOR.PATCH')
          tag = f'v{version[1]}'
          if os.environ['REF_TYPE'] == 'tag' and os.environ['REF_NAME'] != tag:
              raise SystemExit(f'Tag must match Android versionName: {tag}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
  build:
    needs: version
    uses: ./.github/workflows/android.yml
    with:
      require_release_signature: true
    secrets:
      UNIEAR_KEYSTORE_BASE64: ${{ secrets.UNIEAR_KEYSTORE_BASE64 }}
      UNIEAR_KEYSTORE_PASSWORD: ${{ secrets.UNIEAR_KEYSTORE_PASSWORD }}
  publish:
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UniEar-android-release
      - name: Publish the verified APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          apk="UniEar-${TAG}-android.apk"
          mv UniEar-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists. Its assets were left intact."
          else
            gh release create "$TAG" "$apk" "$apk.sha256" --verify-tag --generate-notes --title "UniEar $TAG"
          fi
