name: Documentation

on:
  push:
    paths: ['docs/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: read
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Report missing Pages configuration
        if: steps.pages.outcome == 'failure'
        run: |
          echo '::error::GitHub Pages is unavailable. Check Settings → Pages and select GitHub Actions as the source. Private repositories require a GitHub plan that supports private Pages.'
          exit 1

  docs:
    needs: pages
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
        env:
          DOCS_BASE: ${{ needs.pages.result == 'success' && format('{0}/', needs.pages.outputs.base_path) || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-artifact@v4
        with:
          name: UniEar-documentation
          path: docs/.vitepress/dist/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: needs.pages.result == 'success'
        with:
          path: docs/.vitepress/dist/

  deploy:
    needs: [pages, docs]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
