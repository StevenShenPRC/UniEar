name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out UniEar
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;36.0.0"
      - name: Check out HyperEars
        run: python3 scripts/hyperears.py checkout
      - name: Test and build the signed APK
        run: sh ./gradlew --no-daemon :core:test :desktop:compileKotlin :android:assembleDebug
      - name: Verify APK signature
        run: |
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            android/build/outputs/apk/debug/android-debug.apk
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: UniEar-android-debug
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
