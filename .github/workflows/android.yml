name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    paths: ['android/**', 'core/**', 'upstream/hyperears.rev', '.github/workflows/android.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      require_release_signature:
        type: boolean
        default: true
    secrets:
      UNIEAR_KEYSTORE_BASE64:
        required: true
      UNIEAR_KEYSTORE_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out UniEar
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Check out HyperEars
        run: python3 scripts/hyperears.py checkout
      - name: Test and build the APKs
        run: sh ./gradlew --no-daemon :core:test :desktop:compileKotlin :android:assembleDebug :android:assembleRelease
      - name: Sign and verify release APK
        id: signing
        env:
          REQUIRE_RELEASE_SIGNATURE: ${{ inputs.require_release_signature }}
          UNIEAR_KEYSTORE_BASE64: ${{ secrets.UNIEAR_KEYSTORE_BASE64 }}
          UNIEAR_KEYSTORE_PASSWORD: ${{ secrets.UNIEAR_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$UNIEAR_KEYSTORE_BASE64" && -z "$UNIEAR_KEYSTORE_PASSWORD" ]]; then
            if [[ "$REQUIRE_RELEASE_SIGNATURE" == 'true' ]]; then
              echo '::error::Release signing secrets are required.'
              exit 1
            fi
            echo '::notice::Release signing secrets are absent. Only a debug APK will be uploaded.'
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$UNIEAR_KEYSTORE_BASE64" || -z "$UNIEAR_KEYSTORE_PASSWORD" ]]; then
            echo '::error::Set both UNIEAR_KEYSTORE_BASE64 and UNIEAR_KEYSTORE_PASSWORD.'
            exit 1
          fi

          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/uniear-signing.XXXXXX.p12")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$UNIEAR_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset UNIEAR_KEYSTORE_BASE64
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          apk=android/build/outputs/apk/release/UniEar-release.apk
          "$apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias uniear \
            --ks-pass env:UNIEAR_KEYSTORE_PASSWORD --key-pass env:UNIEAR_KEYSTORE_PASSWORD \
            --out "$apk" android/build/outputs/apk/release/android-release-unsigned.apk
          expected=$(keytool -exportcert -keystore "$keystore" -storetype PKCS12 -alias uniear \
            -storepass:env UNIEAR_KEYSTORE_PASSWORD | sha256sum | cut -d ' ' -f 1)
          verification=$("$apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$verification"
          grep -Fxq "Signer #1 certificate SHA-256 digest: $expected" <<< "$verification"
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - name: Upload fixed-signature release APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: UniEar-android-release
          path: android/build/outputs/apk/release/UniEar-release.apk
          if-no-files-found: error
      - name: Verify debug APK signature
        if: steps.signing.outputs.signed == 'false'
        run: |
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            android/build/outputs/apk/debug/android-debug.apk
      - name: Upload debug APK
        if: steps.signing.outputs.signed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: UniEar-android-debug
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error

  startup:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [32, 36]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: UniEar-android-*
          merge-multiple: true
          path: apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch UniEar and check it stays open
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install apk/*.apk
            adb logcat -c
            adb shell am start -W -n dev.uniear.app/uniear.android.MainActivity
            sleep 3
            adb logcat -b crash -d > startup-crash.log
            cat startup-crash.log
            if grep -F 'Process: dev.uniear.app' startup-crash.log; then exit 1; fi
            adb shell pidof dev.uniear.app
            adb shell dumpsys activity activities | grep -E '(topResumedActivity|mResumedActivity).*dev\.uniear\.app/uniear\.android\.MainActivity'
            python3 scripts/check-android-language.py
